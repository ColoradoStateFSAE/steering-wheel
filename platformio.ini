; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = generic_rp2350

[env:generic_rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
build_flags = 
	-Wall
	-Wfatal-errors
	-fpermissive
lib_deps = 
	autowp/autowp-mcp2515@^1.2.1
	mathertel/OneButton@^2.6.1
	schallbert/ClickEncoder@^1.1.0
	robtillaart/AnalogPin@^0.2.9
	aasim-a/AsyncTimer@^2.4.0
	adafruit/Adafruit NeoPixel@^1.15.1
	https://github.com/ColoradoStateFSAE/dbc
	

[env:test]
platform = native
build_type = test
test_framework = googletest
test_build_src = yes
build_flags = 
	-std=c++20
	-Wall
	-Wfatal-errors
	-lgcov
	-ftest-coverage
	-fprofile-arcs
	-Itest/mock
lib_deps = 
	google/googletest@^1.15.2
	fabiobatsilva/ArduinoFake@^0.4.0
	mathertel/OneButton@^2.6.1
	schallbert/ClickEncoder@^1.1.0
	robtillaart/AnalogPin@^0.2.9
	aasim-a/AsyncTimer@^2.4.0
    https://github.com/ColoradoStateFSAE/dbc

[env:test_mingw]
extends = env:test
build_flags = 
	${env:test.build_flags}
	-Wa,-mbig-obj
